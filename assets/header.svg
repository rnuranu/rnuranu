<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="130" fill="none">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseWave {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .anim-wave {
        stroke-dasharray: 80 120;
        animation: pulseWave 6s linear infinite;
      }
      .cursor {
        animation: cursorBlink 1s step-end infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 26px;
        fill: #f0f6fc;
        letter-spacing: -0.5px;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        fill: #38bdf8;
      }
      .text-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 13px;
        fill: #8b949e;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="850" height="130" rx="8" fill="url(#headerBg)" stroke="#30363d" stroke-width="1" />

  <!-- Left accent bar -->
  <line x1="1" y1="20" x2="1" y2="110" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Typography -->
  <g transform="translate(32, 0)">
    <text x="0" y="38" class="text-mono">rnuranu<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    <text x="0" y="74" class="text-title">Ranu</text>
    <text x="0" y="102" class="text-desc">Full-stack developer • Next.js, React, TypeScript, PHP &amp; CI/CD automation</text>
  </g>

  <!-- Animated Oscilloscope Wave Graphic on the right -->
  <g transform="translate(560, 20)">
    <!-- Baseline track -->
    <path d="M 0 45 L 60 45 Q 80 10, 100 45 T 140 45 Q 160 80, 180 45 T 220 45 L 260 45" 
          stroke="#21262d" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Animated signal beam -->
    <path d="M 0 45 L 60 45 Q 80 10, 100 45 T 140 45 Q 160 80, 180 45 T 220 45 L 260 45" 
          stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" fill="none" class="anim-wave" />
  </g>

  <!-- Subtle bottom edge hairline -->
  <line x1="0" y1="129" x2="850" y2="129" stroke="url(#accentRule)" stroke-width="1" />
</svg>
